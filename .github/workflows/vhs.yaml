name: "VHS Tape"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Tapes
        type: boolean
        default: false

env:
  tape-dir: assets
  image-dir: dist
  bucket: cssnr
  bucket-path: install-release

jobs:
  vhs:
    name: "VHS ${{ matrix.tape }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        tape: [demo, banner]

    permissions:
      contents: read

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Debug event.json"
        continue-on-error: true
        run: cat "${GITHUB_EVENT_PATH}"
      - name: "Debug CTX github"
        continue-on-error: true
        env:
          GITHUB_CTX: ${{ toJSON(github) }}
        run: echo "$GITHUB_CTX"
      - name: "Debug Environment"
        continue-on-error: true
        run: env

      - name: "Set Inputs"
        run: |
          echo github.repository: ${{ github.repository }}
          echo github.event_name: ${{ github.event_name }}
          echo github.ref_name: ${{ github.ref_name  }}

          echo matrix.tape: ${{ matrix.tape }}

          echo env.tape-dir: ${{ env.tape-dir }}
          echo env.image-dir: ${{ env.image-dir }}
          echo env.bucket: ${{ env.bucket }}
          echo env.bucket-path: ${{ env.bucket-path }}

          echo "tape=${{ env.tape-dir }}/${{ matrix.tape }}.tape" >> "$GITHUB_ENV"

      #- name: "Install Release"
      #  if: ${{ inputs.publish }}
      #  uses: jaxxstorm/action-install-gh-release@v1.10.0
      #  with:
      #    repo: ${{ github.repository }}

      #- name: "Install App Dependencies"
      #  run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb

      - name: "Setup Go"
        #if: ${{ !inputs.publish }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: "Go Build"
        #if: ${{ !inputs.publish }}
        run: |
          go build
          stat install-release
          mkdir -p "${{ runner.temp }}/bin"
          mv install-release "${{ runner.temp }}/bin/ir"
          file "${{ runner.temp }}/bin/ir"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: "Set PATH"
        #if: ${{ !inputs.publish }}
        run: |
          echo "::group::PATH"
          echo "$PATH"
          echo "::endgroup::"
          which ir
          ir --version
          ir info
          echo "${HOME}/bin" >> "$GITHUB_PATH"

      - name: "Install VHS"
        uses: jaxxstorm/action-install-gh-release@v1.10.0
        with:
          repo: charmbracelet/vhs
          binaries-location: vhs_0.10.0_Linux_x86_64

      - name: "Install Dependencies"
        id: install
        run: |
          echo "::group::install"
          sudo apt update
          sudo apt install -y ffmpeg ttyd
          echo "::endgroup::"

          ffmpeg -version
          ttyd --version
          vhs --version

      - name: "Create VHS"
        env:
          CI: ""
          TERM: xterm-256color
          COLORTERM: truecolor
        run: |
          vhs "${{ env.tape }}"

      #- name: "Create APNG"
      #  run: |
      #    ffmpeg -i "${{ env.image-dir }}/*.gif output.png

      - name: "Debug VHS"
        run: |
          ls -lAhR "${{ env.image-dir }}"

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.tape }}
          path: ${{ env.image-dir }}

      #- name: "Discord Webhook"
      #  continue-on-error: true
      #  uses: tsickert/discord-webhook@v7.0.0
      #  with:
      #    webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
      #    filename: ${{ env.image }}

      - name: "Setup AWS"
        if: ${{ inputs.publish }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_SECRET }}
          aws-region: us-east-1

      - name: "AWS S3 Upload"
        if: ${{ inputs.publish }}
        id: upload
        run: |
          for image in "${{ env.image-dir }}"/*; do
            echo "Checking: $image"
            [ ! -f "$image" ] && continue
            if [[ "$image" == *.apng ]]; then
              new_image="${image%.apng}.png"
              echo "Renaming: $image -> $new_image"
              mv "$image" "$new_image"
              image="$new_image"
            fi
            filename="$(basename "$image")"

            destination="${{ env.bucket-path }}/${filename}"
            echo "Uploading: $image -> $destination"
            echo aws s3 cp "$image" "s3://${{ env.bucket }}/$destination"
            url="https://${{ env.bucket }}.s3.amazonaws.com/$destination"
            echo "url: $url"
            echo "$url" >> "${{ runner.temp }}/results.txt"
          done
          # Note: could make a matrix from the results...
          echo "::group::results"
          cat -n "${{ runner.temp }}/results.txt"
          echo "::endgroup::"

      #- name: "Debug URL"
      #  if: ${{ inputs.publish }}
      #  continue-on-error: true
      #  run: |
      #    echo "url: ${{ steps.upload.outputs.url }}"

      - name: "Job Summary"
        if: ${{ inputs.publish }}
        continue-on-error: true
        run: |
          md="## VHS 📼 ${{ matrix.tape }}\n\n"
          while IFS= read -r url; do
            echo "Processing url: $url"
            md+="<${url}>\n\n"
            md+="\`\`\`text\n${url}\n\`\`\`\n\n"
            md+="[![URL](${url})](${url})\n\n"
            md+="---\n\n"
          done < "${{ runner.temp }}/results.txt"
          echo -e "${md}" >> "$GITHUB_STEP_SUMMARY"

      #- name: "Web Request"
      #  if: ${{ inputs.publish }}
      #  continue-on-error: true
      #  uses: cssnr/web-request-action@v2
      #  with:
      #    url: ${{ secrets.DISCORD_WEBHOOK }}
      #    data: |
      #      content: "${{ steps.upload.outputs.url }}"
